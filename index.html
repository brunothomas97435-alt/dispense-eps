  D(2, 14, { nature: 'totale', debut: o(-60), fin: o(-30), evaluation: 'non_evalue' });
  D(2, 14, { nature: 'partielle', debut: o(-29), fin: o(10), limitations: ['Course rapide / sprint', 'Sauts et réceptions'], apsa: ['Vitesse / relais', 'Sauts'], roles: ['Juge'], notes: 'Reprise progressive : marche active et course lente autorisées.' });
  D(0, 6, { nature: 'partielle', debut: o(-3), fin: o(11), justificatif: 'infirmerie', limitations: ['Chocs et contacts'], apsa: ['Rugby', 'Lutte', 'Handball'], notes: 'Pas de sports de contact.' });
  D(5, 20, { nature: 'totale', debut: o(-80), anneeEntiere: true, presence: 'dispense_presence', evaluation: 'non_evalue', notes: 'Dispense de présence après avis du médecin scolaire.' });
  classes[5].eleves[20].suiviMedecin = clip(o(-50));
  D(7, 3, { nature: 'ponctuelle', debut: o(0), justificatif: 'parents', evaluation: 'normale', roles: ['Arbitre'] });
  D(1, 18, { nature: 'partielle', debut: o(-70), fin: o(-60), limitations: ['Membres inférieurs'], apsa: ['Football'] });
  D(3, 10, { nature: 'partielle', debut: o(5), fin: o(19), limitations: ['Course prolongée'], apsa: ['Demi-fond'], roles: ['Chronométreur'] });
  const inV = d => st.vacances.some(v => v.debut <= d && d <= v.fin);
  classes.forEach(c => {
    for (let k = 45; k >= 1; k--) {
      const day = addDays(T, -k);
      if (day < st.debut || !c.jours.includes(parse(day).getDay()) || inV(day)) continue;
      const el = {};
      c.eleves.forEach(e => {
        const en = {}, r = rnd();
        if (r < 0.03) en.p = 'A'; else if (r < 0.06) en.p = 'R';
        if (en.p !== 'A') {
          if (rnd() < 0.035) en.t = 1;
          const q = rnd();
          if (q < 0.7) en.i = q < 0.05 ? 1 : q < 0.2 ? 2 : q < 0.5 ? 3 : 4;
          const cc = rnd();
          if (cc < 0.05) { en.c = 1; if (rnd() < 0.6) en.n = pick(['Très bon état d’esprit', 'Aide ses camarades', 'Bon arbitrage', 'Progrès visibles']); }
          else if (cc < 0.08) { en.c = -1; if (rnd() < 0.7) en.n = pick(['Bavardages', 'Refus de pratiquer', 'Téléphone', 'Retard au vestiaire']); }
        }
        if (Object.keys(en).length) el[e.id] = en;
      });
      docs.set(`s_${c.id}_${day}`, { kind: 'seance', classeId: c.id, date: day, faite: true, el, majLe: '' });
    }
  });
  const oc = classes[2], target = oc.eleves[7].id;
  let nOub = 0;
  for (const [id, se] of docs) {
    if (!id.startsWith(`s_${oc.id}_`) || nOub >= 3) continue;
    const en = Object.assign({}, se.el[target], { t: 1, i: 2 });
    delete en.p;
    se.el[target] = en; nOub++;
  }
  const LIEUX = ['Gymnase', 'Plateau sportif', 'Stade'];
  classes.forEach((c, ci) => {
    c.creneaux = c.jours.map((j, i) => (i === 0
      ? { j, h1: ['08:00', '10:05', '13:30', '15:25'][ci % 4], h2: ['10:00', '12:00', '15:25', '17:20'][ci % 4], sem: '', lieu: LIEUX[ci % 3] }
      : { j, h1: ['14:30', '09:00', '11:00', '08:00'][ci % 4], h2: ['15:25', '10:00', '12:00', '09:00'][ci % 4], sem: '', lieu: LIEUX[(ci + 1) % 3] }));
  });
  classes[7].creneaux.push({ j: 1, h1: '16:30', h2: '17:25', sem: 'A', lieu: 'Stade' });
  const CUR = ['Demi-fond', 'Badminton', 'Acrosport', 'Handball', 'Escalade', 'Tennis de table', 'Demi-fond', 'Volley-ball'];
  const PREV = ['Vitesse / relais', 'Gymnastique', 'Course d’orientation', 'Basket-ball', 'Lancers', 'Danse', 'Sauts', 'Football'];
  const v1 = st.vacances[0], v2 = st.vacances[1];
  classes.forEach((c, ci) => {
    docs.set(`q_demo${ci}a`, { kind: 'sequence', classeId: c.id, apsa: PREV[ci], ca: APSA_CA[PREV[ci]] || '', titre: '', debut: st.debut, fin: addDays(v1.debut, -1), nb: '', objectifs: '', evaluation: '' });
    docs.set(`q_demo${ci}b`, { kind: 'sequence', classeId: c.id, apsa: CUR[ci], ca: APSA_CA[CUR[ci]] || '', titre: ci === 0 ? 'Courir à allure régulière' : '', debut: addDays(v1.fin, 1), fin: addDays(v2.debut, -1), nb: '', objectifs: ci === 0 ? 'Construire et respecter un projet d’allure ; utiliser ses sensations et le chronomètre pour réguler sa vitesse.' : '', evaluation: ci === 0 ? 'Course de 3 × 500 m à allure annoncée' : '' });
  });
  const PLANS = [
    ['Trouver son allure', 'Courir 3 minutes à allure régulière', 'Échauffement : footing et gammes (10 min)\nSituation 1 : 3 × 3 min à allure choisie, récupération 1 min 30\nSituation 2 : annoncer son allure et la tenir, observation en binôme\nRetour au calme et bilan', 'Plots tous les 25 m, chronomètres, fiches de binôme'],
    ['Tenir son allure annoncée', 'Annoncer un temps au 500 m et le respecter à 5 s près', 'Échauffement en musique (10 min)\nSituation 1 : 2 × 500 m à allure annoncée, coup de sifflet tous les 100 m\nSituation 2 : rôle de coach, relevé des temps intermédiaires\nÉtirements et bilan', 'Plots, sifflet, chronomètres, fiches d’allure'],
  ];
  const monT = mondayOf(T);
  let pi = 0;
  for (let i = -7; i <= 5; i++) {
    const d = addDays(monT, i);
    if (d < st.debut || !classes[0].jours.includes(parse(d).getDay()) || inV(d)) continue;
    const pl = PLANS[pi++ % 2];
    docs.set(`j_${classes[0].id}_${d}`, { kind: 'journal', classeId: classes[0].id, date: d, titre: pl[0], objectifs: pl[1], deroulement: pl[2], materiel: pl[3], bilan: d < T ? 'Bonne implication ; la moitié du groupe part encore trop vite.' : '', majLe: '' });
  }
  const cA = classes[0], cB = classes[2];
  const mk = (cl, o2) => Object.assign({ kind: 'eval', classeId: cl.id, apsa: '', max: 20, coef: 1, unite: '', horsMoy: false, bareme: { mode: 'aucun', u: [null, null], f: [null, null], g: [null, null] }, notes: {} }, o2);
  const ev1 = mk(cA, { titre: 'Vitesse : 50 m', date: clip('2026-09-25'), apsa: 'Vitesse / relais', type: 'perf', unite: 'temps', bareme: { mode: 'sexe', f: [10.6, 7.9], g: [10.2, 7.3], u: [null, null] } });
  const ev2 = mk(cA, { titre: 'Demi-fond : VMA', date: clip(o(-8)), apsa: 'Demi-fond', type: 'perf', unite: 'kmh', bareme: { mode: 'sexe', f: [8, 13.5], g: [9, 15.5], u: [null, null] } });
  const ev3 = mk(cA, { titre: 'Demi-fond : projet d’allure', date: clip(o(-1)), apsa: 'Demi-fond', type: 'niveau', coef: 2 });
  const ev4 = mk(cB, { titre: 'Acrosport : enchaînement', date: clip(o(-6)), apsa: 'Acrosport', type: 'note' });
  cA.eleves.forEach(e => {
    ev1.notes[e.id] = Math.round(((e.sexe === 'F' ? 8.4 : 7.8) + rnd() * 2) * 10) / 10;
    ev2.notes[e.id] = Math.round(((e.sexe === 'F' ? 9 : 10) + rnd() * 5) * 2) / 2;
    const q = rnd(); ev3.notes[e.id] = q < 0.1 ? 'MI' : q < 0.35 ? 'MF' : q < 0.8 ? 'MS' : 'TBM';
  });
  ev1.notes[cA.eleves[3].id] = 'abs';
  cB.eleves.forEach(e => { ev4.notes[e.id] = Math.round((8 + rnd() * 11) * 2) / 2; });
  ev4.notes[cB.eleves[5].id] = 'disp';
  [ev1, ev2, ev3, ev4].forEach((v, i) => { if (v.date <= T) docs.set('v_demo' + i, v); });
  docs.set('p_' + cA.eleves[2].id, { kind: 'profil', dispositifs: ['PAP'], resp: [], infos: 'Consignes courtes et reformulées ; le placer près de l’enseignant pendant les explications.', annotations: [{ id: 'a1', date: clip(o(-12)), texte: 'Échange avec la famille : bons progrès en endurance.' }] });
  docs.set('p_' + cA.eleves[9].id, { kind: 'profil', dispositifs: ['Section sportive', 'AS'], resp: [], infos: '', annotations: [] });
  docs.set('p_' + cB.eleves[1].id, { kind: 'profil', dispositifs: ['Délégué'], resp: [], infos: '', annotations: [] });
  classes[0].onglets = [{ id: 'appel', type: 'appel', nom: 'Appel' }, { id: 'tvit', type: 'notes', nom: 'Vitesse' }, { id: 'notes', type: 'notes', nom: 'Demi-fond' }, { id: 'tobs', type: 'grille', nom: 'Observation', colonnes: [{ id: 'k1', titre: 'Licence AS', type: 'coche' }, { id: 'k2', titre: 'Rôle de chronométreur', type: 'pastille' }, { id: 'k3', titre: 'Palier test navette', type: 'nombre' }] }, { id: 'dispenses', type: 'dispenses', nom: 'Dispenses' }, { id: 'journal', type: 'journal', nom: 'Journal' }, { id: 'bilan', type: 'bilan', nom: 'Bilan' }, { id: 'eleves', type: 'eleves', nom: 'Élèves' }, { id: 'outils', type: 'outils', nom: 'Outils' }];
  ev1.ongletId = 'tvit'; ev2.ongletId = 'notes'; ev3.ongletId = 'notes';
  const gv = { k1: {}, k2: {}, k3: {} };
  cA.eleves.forEach(e => { if (rnd() < 0.3) gv.k1[e.id] = true; const r = rnd(); if (r < 0.75) gv.k2[e.id] = r < 0.15 ? 'na' : r < 0.4 ? 'ec' : 'a'; gv.k3[e.id] = Math.round((4 + rnd() * 6) * 2) / 2; });
  docs.set('t_tobs', { kind: 'grille', classeId: cA.id, ongletId: 'tobs', valeurs: gv });
  classes.forEach(c => docs.set(c.id, { kind: 'classe', nom: c.nom, niveau: c.niveau, jours: c.jours, creneaux: c.creneaux, onglets: c.onglets, eleves: c.eleves }));
  return docs;
}

routeFromHash();
if (pinGet()) showLock();
render();
boot();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (w) w.addEventListener('statechange', () => {
          if (w.state !== 'activated') return;
          if (hadController) toast('Nouvelle version installée.', [{ label: 'Recharger', run: () => location.reload() }]);
          else if (UI.route === 'donnees') render();
        });
      });
    }).catch(() => {});
  });
}
})();
