:root{
  /* Carnet de suivi EPS : bandeau sombre façon tableau d'affichage, frise en couloirs de piste, le reste sobre. */
  --bg:#edf1f2;
  --surface:#ffffff;
  --surface-2:#f5f8f8;
  --ink:#11222a;
  --ink-2:#3e515a;
  --muted:#62747c;
  --line:#d3dcdf;
  --line-2:#e5ebed;
  --accent:#0a6767;
  --accent-ink:#ffffff;
  --accent-soft:#dcefed;
  --band:#0f232b;
  --band-2:#16303a;
  --band-ink:#eef5f6;
  --band-muted:#9db3ba;
  --band-accent:#53cbc2;
  --lane:#eef3f4;
  --c-total:#b5362a;
  --c-partial:#b07a0c;
  --c-ponct:#4c5fd5;
  --crit:#b5362a;
  --warn:#9a6700;
  --info:#2d5fb0;
  --good:#2a7a4b;
  --focus:#0a6767;
  --font-display:"Barlow Condensed","Avenir Next Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",system-ui,sans-serif;
  --r:12px;
  --shadow:0 1px 2px rgb(15 35 43 / .06),0 8px 24px rgb(15 35 43 / .06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1619;--surface:#142026;--surface-2:#18262d;--ink:#e3ecee;--ink-2:#bccbd0;--muted:#8ea2aa;--line:#2a3b42;--line-2:#1f2f36;
    --accent:#45b8b0;--accent-ink:#04201e;--accent-soft:#143836;--band:#091216;--band-2:#10222a;--band-ink:#eef5f6;--band-muted:#8ca3aa;--band-accent:#53cbc2;
    --lane:#18252b;--c-total:#d9485f;--c-partial:#b8860b;--c-ponct:#7080ea;--crit:#ef6f80;--warn:#e2aa3c;--info:#82a8f0;--good:#5cc38c;--focus:#53cbc2;
    --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .22);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1619;--surface:#142026;--surface-2:#18262d;--ink:#e3ecee;--ink-2:#bccbd0;--muted:#8ea2aa;--line:#2a3b42;--line-2:#1f2f36;
  --accent:#45b8b0;--accent-ink:#04201e;--accent-soft:#143836;--band:#091216;--band-2:#10222a;--band-ink:#eef5f6;--band-muted:#8ca3aa;--band-accent:#53cbc2;
  --lane:#18252b;--c-total:#d9485f;--c-partial:#b8860b;--c-ponct:#7080ea;--crit:#ef6f80;--warn:#e2aa3c;--info:#82a8f0;--good:#5cc38c;--focus:#53cbc2;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .22);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
body.has-modal{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1.1}
h2{font-size:23px;text-transform:uppercase}
h3{font-size:20px;text-transform:uppercase}
p{margin:0 0 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.sm{font-size:13px}
.strong{font-weight:700}
.fw4{font-weight:400}
.num{font-variant-numeric:tabular-nums}

/* Bandeau */
.band{background:var(--band);color:var(--band-ink);position:sticky;top:0;z-index:30}
.band-inner{max-width:1240px;margin:0 auto;padding:12px 20px 4px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.06em;border:2px solid var(--band-accent);color:var(--band-accent);border-radius:5px;padding:1px 7px 0;flex:none}
.brand-title{font-family:var(--font-display);font-weight:600;font-size:21px;text-transform:uppercase;letter-spacing:.04em;line-height:1.05}
.brand-sub{font-size:13px;color:var(--band-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-state{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--band-muted);white-space:nowrap}
.save-state svg{width:14px;height:14px;color:var(--band-accent)}
.save-state.busy span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--band-accent);margin-right:6px;animation:pulse 1s infinite alternate}
.save-state.err{color:#ffb4ab}
.save-state.demo span{border:1px dashed var(--band-muted);border-radius:999px;padding:1px 8px}
@keyframes pulse{from{opacity:.3}to{opacity:1}}
.tabs{max-width:1240px;margin:0 auto;padding:0 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--band-muted);text-decoration:none;padding:10px 12px 9px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--band-ink)}
.tabs a[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--band-accent)}

/* Tableau d'affichage */
.hero{background:var(--band);color:var(--band-ink);border-top:1px solid rgb(255 255 255 / .06)}
.hero-inner{max-width:1240px;margin:0 auto;padding:22px 20px 28px;display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.5fr);gap:28px;align-items:end;position:relative}
.hero-inner::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:2px;background:repeating-linear-gradient(90deg,var(--band-accent) 0 28px,transparent 28px 40px);opacity:.45}
.hero-wd{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--band-accent)}
.hero-day{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 12px;font-family:var(--font-display);font-weight:700;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.hd-n{font-size:clamp(56px,8vw,84px);font-variant-numeric:tabular-nums}
.hd-m{font-size:clamp(26px,3vw,38px)}
.hero-meta{margin-top:8px;color:var(--band-muted);font-size:14px}
.scoreboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--band-2);border:1px solid rgb(255 255 255 / .08);border-top:3px solid var(--tone,var(--band-muted));border-radius:10px;padding:10px 14px 12px;color:inherit;text-decoration:none;display:block}
a.tile:hover{border-color:rgb(255 255 255 / .25);border-top-color:var(--tone)}
.tile-n{font-family:var(--font-display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.tile-l{font-family:var(--font-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;line-height:1.15}
.tile-s{font-size:12.5px;color:var(--band-muted);margin-top:3px}
.t-crit{--tone:#ff7b6e}.t-warn{--tone:#f2b84b}.t-info{--tone:#8fb2ff}.t-ok{--tone:#5fc38f}.t-neutral{--tone:var(--band-accent)}

/* Mise en page */
.wrap{max-width:1240px;margin:0 auto;padding:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.pad0{padding:0;overflow:hidden}
.card + .card{margin-top:16px}
.card-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.card-h > div{display:flex;align-items:center;gap:10px}
.count{font-family:var(--font-display);font-weight:700;font-size:15px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 9px;min-width:28px;text-align:center}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.dash-grid .card + .card{margin-top:0}
.row-gap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pad{padding:16px 18px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700;font-size:14px;line-height:1.1;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.danger-t{color:var(--crit)}
.link{background:none;border:0;padding:0;color:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer;font:inherit}
.link:hover{text-decoration-color:currentColor}
.link.strong{font-weight:700}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:8px;font-size:20px;line-height:1;color:var(--muted);flex:none}
.icon-btn:hover{border-color:var(--line);color:var(--ink)}
.tag{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 5px}

/* Pastilles de nature */
.n-totale{--c:var(--c-total)}.n-partielle{--c:var(--c-partial)}.n-ponctuelle{--c:var(--c-ponct)}
.pill{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;border:1px solid color-mix(in srgb,var(--c) 40%,var(--surface));background:color-mix(in srgb,var(--c) 11%,var(--surface));color:var(--ink)}
.pill.n-totale{--c:var(--c-total)}.pill.n-partielle{--c:var(--c-partial)}.pill.n-ponctuelle{--c:var(--c-ponct)}
.pill i,.sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
.pill.n-partielle i,.sw.n-partielle{background:repeating-linear-gradient(135deg,var(--c-partial) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--c-partial)}
.pill.n-ponctuelle i,.sw.n-ponctuelle{border-radius:50%}
.pill.apte{font-weight:400;color:var(--muted);background:transparent;border-color:var(--line)}

/* Alertes */
.alerts{display:grid;gap:8px}
.alert{--sev:var(--info);display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--sev);border-radius:8px;background:var(--surface)}
.sev-crit{--sev:var(--crit)}.sev-warn{--sev:var(--warn)}.sev-info{--sev:var(--info)}
.sev{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--sev);padding-top:2px}
.sev svg{width:15px;height:15px;flex:none}
.alert-text{font-size:14px;color:var(--ink-2);margin-top:2px}
.alert-act{align-self:center}
.empty-sm{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px;padding:6px 0;flex-wrap:wrap}
.empty-sm svg{width:16px;height:16px;color:var(--good)}

.cl-today{padding:10px 0;border-top:1px solid var(--line-2)}
.cl-today:first-of-type{border-top:0;padding-top:0}
.cl-today-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.cl-today-h .link{font-family:var(--font-display);font-weight:700;font-size:20px;text-decoration:none;letter-spacing:.02em}
.mini-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:3px 0;font-size:14px}

.onboard{max-width:780px}
.steps{margin:14px 0 10px;padding:0;list-style:none;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;position:relative;padding-left:52px;min-height:34px}
.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:-2px;font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--accent);line-height:1}
.steps li .btn{margin-top:8px;display:flex;width:fit-content}

/* Appel */
.appel-top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.cpicker{display:flex;gap:6px;flex-wrap:wrap}
.cpick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.02em}
.cpick:hover{border-color:var(--ink-2)}
.cpick[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cpick b{font-family:var(--font-body);font-size:12px;background:var(--crit);color:#fff;border-radius:999px;padding:0 6px;line-height:18px}
.eps-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.cpick[aria-pressed="true"] .eps-dot{background:var(--band-accent)}
.date-nav{display:flex;align-items:center;gap:6px}
.date-nav input{width:auto}
.appel-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.appel-h h2{font-size:30px}
.appel-count{display:flex;align-items:baseline;gap:8px;justify-content:flex-end}
.appel-count .big{font-family:var(--font-display);font-weight:700;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.appel-break{display:flex;gap:8px;flex-wrap:wrap}
.appel-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.arow{--c:transparent;display:grid;grid-template-columns:34px minmax(0,1fr) auto 40px;gap:12px;align-items:center;padding:8px 18px;border-bottom:1px solid var(--line-2)}
.arow:last-child{border-bottom:0}
.arow.is-inapte{background:color-mix(in srgb,var(--c) 5%,var(--surface));box-shadow:inset 4px 0 0 var(--c)}
.lane-n{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
.a-name .link{text-decoration:none}
.a-act{justify-self:end}
.dsum{display:grid;gap:3px;font-size:14px}
.dsum + .dsum{border-top:1px dashed var(--line);padding-top:4px;margin-top:2px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tg{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;background:var(--surface)}
.tg.no{border-style:dashed}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--warn)}
.flag svg{width:12px;height:12px}
.flag.crit{color:var(--crit)}

/* Appel de séance */
.ahead{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding-top:7px;padding-bottom:7px}
.a-ctrl{display:flex;align-items:center;gap:10px}
.ahead .a-ctrl span{font-size:12px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-ctrl > *{flex:none}
.c-p{width:108px}.c-d{width:104px}.c-t{width:64px}.c-i{width:104px}.c-c{width:72px}
.seg3{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.pb{flex:1;height:34px;border:0;border-right:1px solid var(--line);background:var(--surface);font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--muted);padding:0}
.pb:last-child{border-right:0}
.pb.v-P[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.pb.v-A[aria-pressed="true"]{background:var(--crit);color:#fff}
.pb.v-R[aria-pressed="true"]{background:var(--warn);color:#fff}
.tb{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);padding:0 8px}
.tb[aria-pressed="true"]{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border-color:var(--warn);color:var(--ink)}
.tb[aria-pressed="true"]::before{content:"⚠ "}
.inv{display:flex;align-items:flex-end;gap:4px;height:34px}
.ib{width:23px;height:34px;border:0;padding:0 0 5px;background:none;display:flex;align-items:flex-end;justify-content:center;border-radius:6px}
.ib i{display:block;width:15px;border-radius:3px;background:var(--line)}
.ib.on i{background:var(--accent)}
.ib:not(:disabled):hover i{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
.cmp{display:flex;gap:6px}
.cb{width:33px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700;font-size:18px;line-height:1;color:var(--muted);padding:0}
.db{height:34px;border:1px dashed var(--line);background:var(--surface);border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.db:not(:disabled):hover{border-color:var(--ink-2);color:var(--ink)}
.db.on{border-style:solid;border-color:color-mix(in srgb,var(--c) 45%,var(--surface));background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--ink)}
.db.on i{width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
.db.on.n-partielle i{background:repeating-linear-gradient(135deg,var(--c-partial) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--c-partial)}
.db.on.n-ponctuelle i{border-radius:50%}
.db .w{color:var(--warn);font-size:12px}
.db:disabled{opacity:.3;cursor:not-allowed}
.qopts{display:flex;flex-wrap:wrap;gap:8px}
.qopt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.qopt:hover{border-color:var(--ink-2)}
.qopt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.cb.plus[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.cb.moins[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#fff}
.ib:disabled,.tb:disabled,.cb:disabled{opacity:.3;cursor:not-allowed}
.nb.has{color:var(--accent);border-color:var(--accent)}
.arow.is-abs .a-name{opacity:.5}
.a-inap{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px;width:fit-content}
.a-note{color:var(--ink-2);font-style:italic;margin-top:2px}
.cpick .done{font-style:normal;color:var(--good);font-weight:700;font-size:14px}
.cpick[aria-pressed="true"] .done{color:var(--band-accent)}
.tag.ok{color:var(--good)}
.sumchip{display:inline-flex;gap:5px;align-items:baseline;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface)}
.sumchip b{font-family:var(--font-display);font-size:17px;color:var(--ink)}
.sumchip.abs{border-color:var(--crit)}
.sumchip.ret,.sumchip.oub{border-color:var(--warn)}

/* Bilan */
.btable-wrap{overflow-x:auto}
table.btable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.btable th{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;background:var(--surface-2);border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
.btable th.n,.btable td.n{text-align:right}
.thb{background:none;border:0;padding:9px 10px;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;width:100%;text-align:inherit;cursor:pointer}
.btable th:first-child{width:34px}
.btable td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.btable tr:last-child td{border-bottom:0}
.btable td.hot{background:color-mix(in srgb,var(--warn) 14%,transparent);font-weight:700}
.btable td.lane-n{font-size:15px}
.invbar{display:inline-block;width:52px;height:6px;border-radius:3px;background:var(--line-2);vertical-align:middle;margin-right:6px;overflow:hidden}
.invbar i{display:block;height:100%;background:var(--accent)}
.bnote{max-width:260px;color:var(--ink-2);font-size:13px}
.suivi-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:10px}
.suivi-stats > div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px}
.stat.s{font-size:26px}
.recent{display:grid;gap:4px;font-size:13px;color:var(--ink-2);margin-bottom:14px}

/* Liste des dispenses */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1 1 220px;max-width:320px}
.toolbar select{width:auto}
.spacer{flex:1}
.drow{display:grid;grid-template-columns:minmax(170px,1.3fr) 128px minmax(170px,1.3fr) 100px minmax(150px,1fr) minmax(130px,.9fr);gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.drow:last-child{border-bottom:0}
.drow:hover{background:var(--surface-2)}
.dhead{cursor:default;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.d-who{display:grid}
.st{font-size:13px;font-weight:700}
.st.avenir{color:var(--info)}
.st.terminee{color:var(--muted);font-weight:400}
.ok-t{color:var(--good);display:inline-flex;gap:4px;align-items:center;font-size:13px}
.warn-t{color:var(--warn);display:inline-flex;gap:4px;align-items:center;font-size:13px;font-weight:700}
.ok-t svg,.warn-t svg{width:13px;height:13px;flex:none}
.list-foot{padding:10px 18px;font-size:13px;color:var(--muted);border-top:1px solid var(--line-2)}

/* Classes */
.classes-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.cl-side{position:sticky;top:104px}
.cl-side .card-h{margin-bottom:4px}
.lvl{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:12px 0 4px}
.cl-item{display:flex;width:100%;align-items:center;gap:8px;border:1px solid transparent;background:none;border-radius:8px;padding:5px 8px;text-align:left}
.cl-item:hover{background:var(--surface-2)}
.cl-item[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.cl-n{font-family:var(--font-display);font-weight:600;font-size:17px;flex:1}
.badge{background:var(--crit);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:0 6px;line-height:18px}
.cl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cl-head h2{font-size:32px}
.cl-head .spacer{flex:1}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{width:46px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.04em}
.day[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cl-settings{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin-bottom:6px}
.cl-settings .field{margin-bottom:8px}
.cl-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:16px}
.cl-grid .card + .card{margin-top:0}
.srow{display:grid;grid-template-columns:30px minmax(0,1fr) 20px auto 46px 32px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line-2)}
.s-name{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-cum{text-align:right}
.add-eleve{display:grid;grid-template-columns:1fr 1fr 74px auto;gap:6px;margin-top:12px}
.import-prev{font-size:13px;color:var(--ink-2);margin:8px 0 10px}

/* Formulaires */
input[type=text],input[type=search],input[type=date],input[type=number],input[type=time],input[type=tel],input[type=email],input[type=password],select,textarea{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.field{display:grid;gap:6px;margin-bottom:14px;align-content:start}
.label{font-family:var(--font-display);font-weight:600;font-size:13.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.hint{margin:0;font-size:13px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.check,.radio{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:30px}
.check input,.radio input{width:18px;height:18px;accent-color:var(--accent);margin:0;flex:none}
.radios{display:flex;flex-direction:column;gap:2px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content;max-width:100%}
.seg button{display:inline-flex;align-items:center;gap:7px;border:0;border-right:1px solid var(--line);background:var(--surface);padding:8px 14px;font-weight:700;font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;line-height:1.2}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.chip[aria-pressed="true"]::before{content:"✓ "}
.quick-d{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.summary{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.sum-warn{display:flex;gap:6px;align-items:flex-start;color:var(--warn);margin-top:6px;font-size:13px}
.sum-warn svg{width:14px;height:14px;flex:none;margin-top:2px}
.form-err{color:var(--crit);font-weight:700;margin:0;min-height:1em}
.sep{border:0;border-top:1px solid var(--line);margin:4px 0 14px}

/* Fenêtres */
.modal-wrap{position:fixed;inset:0;z-index:60;background:rgb(6 14 18 / .55);display:flex;justify-content:center;align-items:flex-start;padding:4vh 16px;overflow-y:auto}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgb(0 0 0 / .3);border:1px solid var(--line);outline:none}
.modal.wide{max-width:820px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 10px}
.modal-head h3{font-size:25px}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.modal-body{padding:6px 20px 14px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 14px 14px;position:sticky;bottom:0}
.modal-foot.spread{justify-content:space-between}
.note{font-size:14px;color:var(--ink-2)}

/* Fiche élève */
.sheet-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sheet-stats > div{display:grid;gap:5px;align-content:start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat.over{color:var(--crit)}
.meter{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.over i{background:var(--crit)}
.medecin{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.medecin.need{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 6%,var(--surface))}
.medecin p{margin:0;width:100%;font-size:13px}
.sheet-list{display:grid;gap:8px;margin-top:14px}
.dcard{--c:var(--line);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.dcard-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dcard-h .spacer{flex:1}

/* Frise */
.frise{--lab:170px;--rowh:30px;display:grid;grid-template-columns:var(--lab) minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.frise.compact{grid-template-columns:minmax(0,1fr);--rowh:30px}
.fr-labels{border-right:1px solid var(--line);background:var(--surface);min-width:0}
.fr-h{height:40px;border-bottom:1px solid var(--line)}
.fr-lbody,.fr-body{background:repeating-linear-gradient(180deg,var(--lane) 0 var(--rowh),transparent var(--rowh) calc(var(--rowh) * 2))}
.fr-l{height:var(--rowh);display:flex;align-items:center;padding:0 10px;font-size:13px;min-width:0}
.fr-l .link{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;max-width:100%}
.fr-scroll{overflow-x:auto}
.fr-canvas{position:relative;min-width:620px}
.fr-axis{position:relative;height:40px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.fr-m{position:absolute;top:4px;padding-left:5px;white-space:nowrap;overflow:hidden}
.fr-p{position:absolute;bottom:3px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.fr-body{position:relative}
.fr-bg{position:absolute;inset:0;pointer-events:none}
.fr-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.fr-pline{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--ink-2);opacity:.35}
.fr-vac{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 24%,transparent) 0 1px,transparent 1px 6px);background-color:color-mix(in srgb,var(--muted) 8%,transparent)}
.fr-today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent)}
.fr-today-l{position:absolute;bottom:3px;font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap;padding-left:4px}
.fr-lane{position:relative;height:var(--rowh)}
.fr-bar{position:absolute;top:50%;height:12px;margin-top:-6px;border:0;padding:0;border-radius:4px;background:var(--c);box-shadow:0 0 0 2px var(--surface);min-width:3px}
.fr-bar.n-partielle{background:repeating-linear-gradient(135deg,var(--c-partial) 0 4px,color-mix(in srgb,var(--c-partial) 38%,var(--surface)) 4px 7px)}
.fr-dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border:0;padding:0;border-radius:50%;background:var(--c-ponct);box-shadow:0 0 0 2px var(--surface)}
.fr-bar:hover,.fr-dot:hover,.fr-bar:focus-visible,.fr-dot:focus-visible{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink);outline:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:18px;height:10px;border-radius:3px;background:var(--c)}
.lg.n-partielle{background:repeating-linear-gradient(135deg,var(--c-partial) 0 3px,color-mix(in srgb,var(--c-partial) 38%,var(--surface)) 3px 5px)}
.lg-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c-ponct)}
.lg.vac{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 40%,transparent) 0 1px,transparent 1px 4px);border:1px solid var(--line)}
.lg.today{width:2px;height:14px;background:var(--accent);border-radius:0}

/* Réglages */
.set-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.set-grid > div > .card + .card{margin-top:16px}
.plist{display:grid;gap:6px;margin-bottom:8px}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) 150px 150px 32px;gap:6px;align-items:center}
.set-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.dirty{font-size:13px;color:var(--warn);font-weight:700}
.danger-zone{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.gen-rows{display:grid;gap:8px;margin-bottom:14px}
.gen-row{display:grid;grid-template-columns:90px 90px 1fr;gap:10px;align-items:center}
.gen-prev{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow:auto;padding:10px;border:1px dashed var(--line);border-radius:8px}
.gchip{font-family:var(--font-display);font-weight:600;font-size:15px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface-2)}
.gchip.exists{text-decoration:line-through;color:var(--muted)}

/* Cahier journal */
.wk-lab{font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:.02em}
.abtag{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--surface);border-radius:6px;padding:2px 8px}
.edt{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
.edt-col{border-right:1px solid var(--line-2);padding:10px 8px;display:flex;flex-direction:column;gap:8px;min-height:180px;min-width:0}
.edt-col:last-child{border-right:0}
.edt-col.today{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.edt-day{display:flex;align-items:baseline;gap:5px;font-family:var(--font-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-size:14px;padding:0 4px 6px;border-bottom:1px solid var(--line-2)}
.edt-day b{font-size:24px;color:var(--ink)}
.edt-col.today .edt-day b{color:var(--accent)}
.edt-vac,.edt-empty{color:var(--muted);font-size:13px;padding:6px 4px}
.edt-vac{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 18%,transparent) 0 1px,transparent 1px 6px);border-radius:8px;padding:10px}
.slot{display:grid;gap:2px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.slot:hover{border-color:var(--ink-2);border-left-color:var(--accent)}
.slot-h{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.slot-h .ok-t svg{width:12px;height:12px}
.slot-c{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.1}
.slot-q{font-size:12px;font-weight:700;color:var(--accent)}
.slot-t{font-size:13px;overflow-wrap:anywhere}
.slot-l{font-size:12px}
.seqs{display:grid;gap:14px}
.seq-cl h3{font-size:17px;margin-bottom:6px}
.seq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px}
.seq.cur{border-left:4px solid var(--accent)}
.seq-t{font-weight:700}
.seq-m{font-size:13px;color:var(--muted)}
.prog{height:5px;background:var(--line-2);border-radius:3px;overflow:hidden;margin-top:5px;max-width:240px}
.prog i{display:block;height:100%;background:var(--accent)}
/* Créneaux et semaines A/B */
.cr-field{flex:1 1 560px}
.crlist{display:grid;gap:6px}
.crrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crrow select{width:118px}
.crrow input[type=time]{width:112px}
.crrow select[data-k=sem]{width:150px}
.crrow input[type=text]{flex:1 1 140px;width:auto}
.abweeks{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.abw{display:inline-flex;flex-direction:column;align-items:center;min-width:46px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 4px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.abw b{font-family:var(--font-display);font-size:16px;color:var(--ink);line-height:1.1}
.abw.vB{background:var(--accent-soft)}
.abw.vac{opacity:.4}
.abw.anc{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.abw.cur{outline:2px solid var(--ink);outline-offset:1px}
/* Cahier de notes */
.gwrap{overflow:auto;max-height:72vh}
table.gtable{border-collapse:separate;border-spacing:0;font-size:14px;font-variant-numeric:tabular-nums;min-width:100%}
.gtable th,.gtable td{border-bottom:1px solid var(--line-2);padding:4px 6px;background:var(--surface);white-space:nowrap}
.gtable thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);border-bottom:1px solid var(--line);vertical-align:bottom;text-align:left}
.gtable .sticky{position:sticky;left:0;z-index:1;min-width:170px;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.gtable thead .sticky{z-index:3}
.gtable tfoot td{background:var(--surface-2);font-weight:700;border-top:1px solid var(--line);position:sticky;bottom:0;font-size:13px}
.gtable tfoot .sticky{z-index:2}
.gh-b{display:grid;gap:1px;text-align:left;background:none;border:0;padding:4px 2px;font:inherit;color:inherit;min-width:92px;max-width:160px;cursor:pointer;white-space:normal}
.gh-t{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.1;color:var(--ink)}
.gh-s{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none}
.gh-b:hover .gh-t{color:var(--accent)}
.gc{position:relative}
.gcell{width:86px;min-height:34px;text-align:center;padding:4px 6px}
select.gcell{text-align-last:center;padding:4px 2px}
.gcell.bad{border-color:var(--crit);outline:2px solid var(--crit)}
.gcell::placeholder{color:var(--warn);font-size:12px}
.g20{position:absolute;right:9px;bottom:5px;font-size:10px;color:var(--muted);pointer-events:none}
.niv-MI{background:color-mix(in srgb,var(--crit) 14%,var(--surface))}
.niv-MF{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.niv-MS{background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.niv-TBM{background:color-mix(in srgb,var(--good) 26%,var(--surface))}
.gmoy{font-family:var(--font-display);font-weight:700;font-size:17px;text-align:right;padding-right:12px!important}
.gstat{text-align:center;color:var(--ink-2)}
.bm-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:8px}
.bm-row .strong{width:70px}
.bm-row input{width:90px;margin-left:6px}
.seg button:disabled{opacity:.4;cursor:not-allowed}
/* Outils */
.tools-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
.tools-grid > div > .card + .card{margin-top:16px}
.draw-name{font-family:var(--font-display);font-weight:700;font-size:clamp(32px,5.4vw,56px);text-transform:uppercase;line-height:1.05;text-align:center;padding:22px 12px;margin:4px 0 14px;border-radius:12px;background:var(--band);color:var(--band-ink);min-height:118px;display:grid;place-items:center;letter-spacing:.02em;overflow-wrap:anywhere}
.draw-name.rolling{color:var(--band-muted)}
.draw-name.final{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.big-time{font-family:var(--font-display);font-weight:700;font-size:clamp(52px,8vw,84px);line-height:1;font-variant-numeric:tabular-nums;text-align:center;padding:8px 0 14px;letter-spacing:.02em}
.big-time.done{color:var(--crit)}
.laps{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-variant-numeric:tabular-nums;font-size:14px;max-height:220px;overflow:auto}
.laps li{display:grid;grid-template-columns:1fr auto auto;gap:14px;border-bottom:1px solid var(--line-2);padding:4px 2px}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:14px}
.team{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.team.target{border-style:dashed;border-color:var(--accent);cursor:pointer;background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.team-h{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.team-h b{font-family:var(--font-display);font-size:19px;flex:1}
.chas{width:14px;height:14px;border-radius:4px;border:1px solid rgb(0 0 0 / .25);flex:none;display:inline-block}
.tm{text-align:left;border:1px solid transparent;background:var(--surface-2);border-radius:6px;padding:5px 8px;font-size:14px}
.tm.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.saved-g{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-2);padding:6px 0;font-size:14px}
/* Fiche élève enrichie */
.av{display:inline-grid;place-items:center;border-radius:50%;object-fit:cover;flex:none;background:var(--accent-soft);color:var(--accent);font-family:var(--font-display);font-weight:700;vertical-align:middle}
.av-s{width:28px;height:28px;font-size:12px;margin-right:6px}
.av-m{width:56px;height:56px;font-size:21px}
.av-l{width:84px;height:84px;font-size:30px}
.sheet-head{display:flex;align-items:center;gap:12px}
.stabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 20px 10px}
.stab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.prof-top{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.resp{display:grid;grid-template-columns:130px 1fr 150px 1fr;gap:6px;margin-bottom:6px}
.annots{display:grid;gap:6px;margin-top:8px}
.annot{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;font-size:14px}
.annot > span:first-child{flex:none;padding-top:1px}
.annot .icon-btn{margin-left:auto}
.dtags{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle;flex-wrap:wrap}
.dtag{font-size:10.5px;font-weight:700;letter-spacing:.03em;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink-2);background:var(--surface-2);line-height:1.5}
.trombi{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tcard{display:grid;justify-items:center;gap:4px;text-align:center;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:10px 6px;font-size:13px}
.tcard:hover{border-color:var(--ink-2)}
/* Code d'accès */
.lock-btn{background:none;border:1px solid rgb(255 255 255 / .22);color:var(--band-muted);border-radius:8px;padding:4px 9px;font-size:13px}
.lock-btn:hover{color:var(--band-ink)}
#lock{position:fixed;inset:0;z-index:200;background:var(--band);color:var(--band-ink);display:grid;place-items:center;padding:20px}
#lock[hidden]{display:none}
body.locked #view,body.locked #banner,body.locked #modal-root,body.locked .tabs{visibility:hidden}
.lock-box{display:grid;justify-items:center;gap:16px;width:min(320px,100%);text-align:center}
.lock-box .brand-title{font-size:24px}
#lock-msg{color:var(--band-muted);max-width:300px;margin:0}

function writeErrMsg(code) {
  if (code === 'quota_exceeded') return 'Espace de stockage plein : télécharge une sauvegarde puis efface les dispenses des années passées.';
  if (code === 'invalid_argument') return 'Enregistrement refusé : ton accès à cette page ne permet pas d’enregistrer.';
  if (code === 'revoked') return 'L’accès à cette page a changé : recharge-la.';
  return 'Enregistrement impossible pour le moment. Télécharge une sauvegarde avant de fermer la page.';
}
async function doWrite(id, body, attempt = 0) {
  const ref = Store.col.doc(id);
  try {
    if (body === null) await ref.delete(); else await ref.set(body);
  } catch (e) {
    const code = e && e.code;
    if ((code === 'unavailable' || code === 'resource_exhausted') && attempt < 3) {
      await sleep(500 * (attempt + 1) + Math.random() * 400);
      return doWrite(id, body, attempt + 1);
    }
    throw e;
  }
}
function queueWrite(id, body) {
  WQ.pending.set(id, body);
  if (!WQ.order.includes(id)) WQ.order.push(id);
  pump();
  renderSaveState();
}
function pump() {
  while (WQ.active < WQ.max) {
    const i = WQ.order.findIndex(id => !WQ.inflight.has(id));
    if (i < 0) break;
    const id = WQ.order.splice(i, 1)[0];
    if (!WQ.pending.has(id)) continue;
    const body = WQ.pending.get(id);
    WQ.pending.delete(id);
    WQ.inflight.add(id);
    WQ.active++;
    doWrite(id, body)
      .then(() => { WQ.error = null; })
      .catch(err => { WQ.error = (err && err.code) || 'unavailable'; toast(writeErrMsg(WQ.error)); })
      .finally(() => { WQ.inflight.delete(id); WQ.active--; pump(); renderSaveState(); });
  }
}
function saveLocal(id, body) {
  if (Store.mode !== 'local') return;
  if (IDB.db) { idbWrite(id, body).catch(() => { toast('Enregistrement impossible sur cet appareil. Télécharge une sauvegarde.'); }); return; }
  try { localStorage.setItem(LS_KEY, JSON.stringify(Object.fromEntries(Store.real))); }
  catch (e) { Store.mode = 'memory'; toast('Impossible d’enregistrer dans ce navigateur. Télécharge une sauvegarde.'); }
}
function putDoc(id, body, silent) {
  body = clone(body);

    Store.real.set(id, body);
    if (Store.mode === 'cloud') queueWrite(id, body); else saveLocal(id, body);

}
function delDoc(id, silent) {
  if (Store.demo) Store.demoDocs.delete(id);

}
function snapshotIds(ids) { const d = Store.docs(); return ids.map(id => [id, d.has(id) ? clone(d.get(id)) : null]); }
function restoreSnap(snap) { snap.forEach(([id, b]) => (b ? putDoc(id, b, true) : delDoc(id, true))); refresh(); }
function demoDismissed() { try { return localStorage.getItem(LS_DEMO_OFF) === '1'; } catch (e) { return !!Store._demoOff; } }
function setDemoDismissed() { Store._demoOff = true; try { localStorage.setItem(LS_DEMO_OFF, '1'); } catch (e) {} }
function enterDemo() { Store.demo = true; Store.demoDocs = buildDemo(); rebuild(); }
function exitDemo() { Store.demo = false; Store.demoDocs = null; setDemoDismissed(); UI.appelClasse = null; UI.classeSel = null; UI.settingsDraft = null; rebuild(); }

async function boot() {
  const C = window.claude;
  let db = null, user = null, dl = null;
  if (C && typeof C.use === 'function') {
    const use = n => Promise.resolve().then(() => C.use(n)).catch(() => null);
    [db, user, dl] = await Promise.all([use('db'), use('user'), use('downloads')]);
  }
  Store.downloads = dl;
  let uid = null;
  if (db && user && typeof user.id === 'function') { try { uid = await user.id(); } catch (e) { uid = null; } }
  if (db && uid) {
    try { startCloud(db, uid); return; } catch (e) { /* passe en local */ }
  }
  startLocal();
}
function startCloud(db, uid) {
  Store.col = db.collection('data/users/' + uid);
  Store.mode = 'cloud';
  const timer = setTimeout(() => {
    if (!Store.definitive) {
      Store.slow = true;
      if (Store.phase === 'loading') { Store.phase = 'ready'; rebuild(); }
      render();
    }
  }, 10000);
  Store.col.onSnapshot(snap => {
    const m = new Map();
    for (const d of snap.docs) if (d.exists) m.set(d.id, d.data());
    for (const [id, b] of WQ.pending) { if (b === null) m.delete(id); else m.set(id, b); }
    if (!snap.metadata.fromCache) { Store.definitive = true; Store.slow = false; clearTimeout(timer); }
    applyRemote(m);
  }, err => {
    clearTimeout(timer);
    Store.error = (err && err.code) || 'unavailable';
    if (Store.phase === 'loading') startLocal();
    else render();
  });
}
function applyRemote(m) {
  Store.real = m;
  if (Store.phase === 'loading') {
    if (m.size > 0) Store.phase = 'ready';
    else if (Store.definitive) { Store.phase = 'ready'; if (!demoDismissed()) enterDemo(); }
    else return;
  } else if (Store.demo && m.size > 0) {
    Store.demo = false; Store.demoDocs = null;
    toast('Tes données ont été chargées.');
  }
  refresh();
}
async function startLocal() {
  Store.mode = 'local';
  let m = null;
  if (window.indexedDB) {
    try {
      IDB.db = await idbOpen();
      m = await idbAll(IDB.db);
      let legacy = null;
      try { const raw = localStorage.getItem(LS_KEY); legacy = raw ? JSON.parse(raw) : null; } catch (e) { legacy = null; }
      if (!m.size && legacy && Object.keys(legacy).length) {
        for (const [id, b] of Object.entries(legacy)) { await idbWrite(id, b); m.set(id, b); }
        try { localStorage.removeItem(LS_KEY); } catch (e) { /* rien */ }
      }
    } catch (e) { IDB.db = null; m = null; }
  }
  if (!m) {
    try { const raw = localStorage.getItem(LS_KEY); m = new Map(Object.entries(raw ? JSON.parse(raw) : {})); }
    catch (e) { Store.mode = 'memory'; m = new Map(); }
  }
  Store.real = m;
  Store.phase = 'ready';
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* rien */ }
  if (!Store.real.size && !demoDismissed()) enterDemo();
  refresh();
}

const cmpClasse = (a, b) => {
  const ia = NIVEAUX.indexOf(a.niveau), ib = NIVEAUX.indexOf(b.niveau);
  return ((ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib)) || collator.compare(a.nom || '', b.nom || '');

const cmpEleve = (a, b) => collator.compare(a.nom || '', b.nom || '') || collator.compare(a.prenom || '', b.prenom || '');
const nomComplet = e => `${e.nom || ''} ${e.prenom || ''}`.trim();

function rebuild() {
  const docs = Store.docs();
  const r = docs.get('reglages');
  S.settings = Object.assign(clone(DEFAULT_SETTINGS), r ? clone(r) : {});

  if (!isIso(S.settings.debut)) S.settings.debut = DEFAULT_SETTINGS.debut;
  if (!isIso(S.settings.fin)) S.settings.fin = DEFAULT_SETTINGS.fin;

  S.classes = [];
  const disp = [], ses = [], jr = [], sq = [], ev = [], gr = [];
  const prof = new Map();
  let acks = {};
  for (const [id, b] of docs) {
    if (!b || typeof b !== 'object') continue;
    if (id.startsWith('c_')) S.classes.push(Object.assign({}, b, { id, eleves: Array.isArray(b.eleves) ? b.eleves.slice() : [], onglets: normOnglets(b), couleur: b.couleur || '', creneaux: normCreneaux(b), jours: [...new Set(normCreneaux(b).map(k => k.j))] }));
    else if (id.startsWith('d_')) disp.push(Object.assign({}, b, { id }));
    else if (id.startsWith('s_') && isIso(b.date)) ses.push(Object.assign({}, b, { id }));
    else if (id === 'acks' && b.v && typeof b.v === 'object') acks = b.v;
    else if (id.startsWith('j_') && isIso(b.date)) jr.push(Object.assign({}, b, { id }));
    else if (id.startsWith('q_') && isIso(b.debut) && isIso(b.fin)) sq.push(Object.assign({}, b, { id }));
    else if (id.startsWith('v_') && isIso(b.date)) ev.push(Object.assign({}, b, { id }));

    else if (id.startsWith('p_')) prof.set(id.slice(2), b);
  }
  S.classes.sort(cmpClasse);
  S.eleves = new Map();
  for (const c of S.classes) { c.eleves.sort(cmpEleve); for (const e of c.eleves) S.eleves.set(e.id, { e, c }); }
  S.dispenses = disp.filter(d => S.eleves.has(d.eleveId) && isIso(d.debut) && NATURES[d.nature]);
  S.byEleve = new Map();
  for (const d of S.dispenses) { if (!S.byEleve.has(d.eleveId)) S.byEleve.set(d.eleveId, []); S.byEleve.get(d.eleveId).push(d); }
  for (const l of S.byEleve.values()) l.sort((a, b) => (a.debut < b.debut ? -1 : a.debut > b.debut ? 1 : 0));
  S.acks = acks;
  S.journal = new Map(jr.map(x => [x.id, x]));
  S.sequences = sq.sort((a, b) => (a.debut < b.debut ? -1 : a.debut > b.debut ? 1 : 0));
  S.evals = ev.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : collator.compare(a.titre || '', b.titre || '')));
  S.groupes = gr.sort((a, b) => ((a.date || '') < (b.date || '') ? 1 : -1));
  S.profils = prof;
  S.seances = new Map(); S.seancesByClasse = new Map(); S.seancesByEleve = new Map();
  for (const x of ses) {
    S.seances.set(x.id, x);
    if (!S.seancesByClasse.has(x.classeId)) S.seancesByClasse.set(x.classeId, []);
    S.seancesByClasse.get(x.classeId).push(x.date);
    for (const [eid, en] of Object.entries(x.el || {})) {
      if (!S.eleves.has(eid) || !en || typeof en !== 'object') continue;
      if (!S.seancesByEleve.has(eid)) S.seancesByEleve.set(eid, []);

}
function finOf(d) { return d.anneeEntiere ? S.settings.fin : (isIso(d.fin) ? d.fin : d.debut); }
function isActive(d, day) { return d.debut <= day && day <= finOf(d); }
function statut(d, day) { if (day < d.debut) return 'avenir'; if (day > finOf(d)) return 'terminee'; return 'encours'; }
function best(list) { let b = null; for (const d of list) if (!b || NATURES[d.nature].rank > NATURES[b.nature].rank) b = d; return b; }
function activesOn(eid, day) { return (S.byEleve.get(eid) || []).filter(d => isActive(d, day)); }
function activeOn(eid, day) { return best(activesOn(eid, day)); }
function dureeJours(d) { return diffDays(d.debut, finOf(d)) + 1; }
function inVac(s) { return S.settings.vacances.some(v => v.debut <= s && s <= v.fin); }
function vacOf(s) { return S.settings.vacances.find(v => v.debut <= s && s <= v.fin); }
function periodeOf(s) { return S.settings.periodes.find(p => p.debut <= s && s <= p.fin); }
function mergeIntervals(list) {
  const st = S.settings;
  const iv = list.map(d => [maxIso(d.debut, st.debut), minIso(finOf(d), st.fin)]).filter(([a, b]) => a <= b).sort((x, y) => (x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0));
  const out = [];
  for (const [a, b] of iv) {
    const last = out[out.length - 1];
    if (last && a <= addDays(last[1], 1)) { if (b > last[1]) last[1] = b; } else out.push([a, b]);
  }
  return out;
}
function cumulList(list) { return mergeIntervals(list.filter(d => d.nature !== 'ponctuelle')).reduce((n, [a, b]) => n + diffDays(a, b) + 1, 0); }
function cumul(eid) {
  const k = 'cum|' + eid;
  if (!MEMO.has(k)) MEMO.set(k, cumulList(S.byEleve.get(eid) || []));
  return MEMO.get(k);
}
function seances(c, a, b) {
  if (!c || !c.creneaux || !c.creneaux.length || !isIso(a) || !isIso(b)) return null;
  const x = maxIso(a, S.settings.debut), y = minIso(b, S.settings.fin);
  if (x > y) return 0;
  const k = `se|${c.id}|${x}|${y}`;
  if (MEMO.has(k)) return MEMO.get(k);
  let n = 0;
  const d = parse(x), end = parse(y);
  while (d <= end) { if (epsOn(c, iso(d))) n++; d.setDate(d.getDate() + 1); }
  MEMO.set(k, n);
  return n;
}
function seancesEleve(eid) {
  const x = S.eleves.get(eid); if (!x) return null;
  if (!x.c.creneaux.length) return null;
  return mergeIntervals(S.byEleve.get(eid) || []).reduce((n, [a, b]) => n + seances(x.c, a, b), 0);
}

const seanceId = (cid, date) => `s_${cid}_${date}`;
function seanceOf(cid, date) { return S.seances.get(seanceId(cid, date)) || null; }
function entryOf(se, eid) { return (se && se.el && se.el[eid]) || {}; }
function setEntry(cid, date, eid, patch) {
  const id = seanceId(cid, date), cur = S.seances.get(id);
  const body = { kind: 'seance', classeId: cid, date, faite: true, el: cur ? clone(cur.el || {}) : {} };
  const en = Object.assign({}, body.el[eid] || {}, patch);
  Object.keys(en).forEach(k => { if (en[k] === '' || en[k] === 0 || en[k] === false || en[k] == null) delete en[k]; });
  if (Object.keys(en).length) body.el[eid] = en; else delete body.el[eid];
  body.majLe = new Date().toISOString();
  putDoc(id, body);
}
function validerAppel(cid, date) {
  if (seanceOf(cid, date)) return false;
  putDoc(seanceId(cid, date), { kind: 'seance', classeId: cid, date, faite: true, el: {}, majLe: new Date().toISOString() });
  return true;
}
function appelCtx() { const day = isIso(UI.appelDate) ? UI.appelDate : todayIso(); return { cid: currentAppelClasse(day).id, day }; }
function periodRange(key) {
  const st = S.settings;
  if (key != null && key !== 'annee') { const p = st.periodes[Number(key)]; if (p && isIso(p.debut) && isIso(p.fin)) return [p.debut, p.fin, p.nom]; }
  return [st.debut, st.fin, 'l’année'];
}
function currentPeriodKey(T) { const i = S.settings.periodes.findIndex(p => p.debut <= T && T <= p.fin); return i >= 0 ? String(i) : 'annee'; }
function seancesClasse(cid, a, b) { return (S.seancesByClasse.get(cid) || []).filter(d => d >= a && d <= b).length; }
function statsEleve(eid, a, b) {
  const k = `st|${eid}|${a}|${b}`;
  if (MEMO.has(k)) return MEMO.get(k);
  const st = { abs: 0, ret: 0, oub: 0, invSum: 0, invN: 0, plus: 0, moins: 0, notes: [], inv: null };
  for (const r of S.seancesByEleve.get(eid) || []) {
    if (r.date < a || r.date > b) continue;
    const en = r.en;
    if (en.p === 'A') st.abs++; else if (en.p === 'R') st.ret++;
    if (en.t) st.oub++;
    if (en.i >= 1 && en.i <= 4) { st.invSum += en.i; st.invN++; }
    if (en.c === 1) st.plus++; else if (en.c === -1) st.moins++;
    if (en.n) st.notes.push({ date: r.date, n: en.n });
  }
  if (st.invN) st.inv = st.invSum / st.invN;
  MEMO.set(k, st);
  return st;
}
function cumulRange(eid, a, b) {
  return mergeIntervals((S.byEleve.get(eid) || []).filter(d => d.nature !== 'ponctuelle')).reduce((n, [x, y]) => { const u = maxIso(x, a), v = minIso(y, b); return u <= v ? n + diffDays(u, v) + 1 : n; }, 0);
}
const invFmt = v => v.toFixed(1).replace('.', ',');

function computeAlerts(T) {
  const st = S.settings, out = [];
  for (const [eid, list] of S.byEleve) {
    const x = S.eleves.get(eid); if (!x) continue;
    const cum = cumul(eid);
    if (cum > st.seuil && !x.e.suiviMedecin) out.push({ sev: 'crit', kind: 'medecin', eid, sort: 0, text: `${cum} jours d’inaptitude sur l’année (seuil de ${st.seuil} j). Transmets le certificat au médecin scolaire pour un suivi particulier.` });
    const activeNow = list.some(d => isActive(d, T) && d.nature !== 'ponctuelle');
    for (const d of list) {
      const s = statut(d, T), f = finOf(d);
      if (!d.justifRecu && (s !== 'terminee' || diffDays(f, T) <= 14)) {
        out.push({ sev: 'warn', kind: 'justif', eid, did: d.id, sort: 1, text: `${esc(JUSTIF_S[d.justificatif] || 'Justificatif')} à récupérer (${esc(NATURES[d.nature].label.toLowerCase())} ${d.nature === 'ponctuelle' ? 'du ' + fmtJ(d.debut) : 'à partir du ' + fmtJ(d.debut)})` });
      }
      if (d.nature !== 'ponctuelle' && s === 'encours' && !d.anneeEntiere) {
        const r = diffDays(T, f);
        if (r <= st.finProche) out.push({ sev: 'info', kind: 'fin', eid, did: d.id, sort: 2 + r / 100, text: r === 0 ? 'Dernier jour d’inaptitude aujourd’hui : reprise au prochain cours, sauf nouveau certificat.' : `Fin de l’inaptitude ${r === 1 ? 'demain' : 'dans ' + r + ' jours'} (${fmtJ(f)}). Prévois la reprise ou demande un nouveau certificat.` });
      }
      if (d.nature !== 'ponctuelle' && s === 'terminee' && !d.repriseVue && diffDays(f, T) <= 7 && !activeNow) {
        out.push({ sev: 'info', kind: 'reprise', eid, did: d.id, sort: 3, text: `Inaptitude terminée le ${fmtJ(f)} : sans nouveau certificat, l’élève reprend la pratique.` });
      }
    }
  }
  const [pa, pb, pnom] = periodRange(currentPeriodKey(T));
  const perTxt = pnom === 'l’année' ? 'l’année' : pnom.toLowerCase();
  for (const eid of S.seancesByEleve.keys()) {
    const sx = statsEleve(eid, pa, pb);
    [['abs', sx.abs, st.seuilAbsences, plural(sx.abs, 'absence')], ['oub', sx.oub, st.seuilOublis, plural(sx.oub, 'oubli') + ' de tenue'], ['comp', sx.moins, st.seuilComportement, plural(sx.moins, 'remarque') + ' de comportement']].forEach(([k, v, seuil, lab]) => {
      const key = `${eid}|${k}|${pa}`;
      if (v >= seuil && v > (S.acks[key] || 0)) out.push({ sev: 'info', kind: 'suivi', eid, key, v, sort: 2.5, text: `${esc(lab)} sur ${esc(perTxt)} : pense à prévenir la famille ou le professeur principal.` });
    });
  }
  out.sort((a, b) => a.sort - b.sort);
  return out;
}

function perAbbr(nom, i) { const m = /(\d)/.exec(nom || ''); return m ? (nom.trim()[0] || 'P').toUpperCase() + m[1] : (nom || 'P' + (i + 1)); }
function frise(rows, opts = {}) {
  const st = S.settings, Y0 = st.debut, Y1 = st.fin, T = todayIso();
  const tot = Math.max(1, diffDays(Y0, Y1) + 1);
  const P = s => Math.max(0, Math.min(100, (diffDays(Y0, s) / tot) * 100));
  let axis = '', bg = '';
  let m = new Date(parse(Y0).getFullYear(), parse(Y0).getMonth(), 1);
  while (iso(m) <= Y1) {
    const s = iso(m), next = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    const l = P(maxIso(s, Y0)), r = P(minIso(iso(next), addDays(Y1, 1)));
    if (r - l > 3.2) axis += `<span class="fr-m" style="left:${l}%;width:${r - l}%">${MOIS[m.getMonth()]}</span>`;
    if (s > Y0) bg += `<i class="fr-grid" style="left:${l}%"></i>`;
    m = next;
  }
  st.periodes.forEach((p, i) => {
    if (!isIso(p.debut) || !isIso(p.fin)) return;
    const l = P(p.debut), r = P(addDays(p.fin, 1));
    if (r - l > 2) axis += `<span class="fr-p" style="left:${l}%;width:${r - l}%">${esc(perAbbr(p.nom, i))}</span>`;
    if (i > 0) bg += `<i class="fr-pline" style="left:${l}%"></i>`;
  });
  st.vacances.forEach(v => { if (isIso(v.debut) && isIso(v.fin)) bg += `<i class="fr-vac" style="left:${P(v.debut)}%;width:${Math.max(0, P(addDays(v.fin, 1)) - P(v.debut))}%"></i>`; });

  const half = (P(addDays(Y0, 1)) - P(Y0)) / 2;
  const lanes = rows.map(r => `<div class="fr-lane">${r.list.map(d => {
    const f = finOf(d);
    const tip = `${r.label}\n${NATURES[d.nature].label}\n${d.nature === 'ponctuelle' ? fmtJ(d.debut) : fmtJ(d.debut) + ' → ' + fmtJ(f) + ' (' + plural(dureeJours(d), 'jour') + ')'}${(d.limitations || []).length ? '\n' + d.limitations.join(', ') : ''}`;

    const l = P(d.debut), w = Math.max(0.35, P(addDays(f, 1)) - l);

  }).join('')}</div>`).join('');
  const labels = rows.map(r => `<div class="fr-l"><button type="button" class="link" data-act="eleve" data-id="${r.id}" title="${esc(r.label)}">${esc(r.label)}</button></div>`).join('');
  return `<div class="frise ${opts.compact ? 'compact' : ''}">
    ${opts.compact ? '' : `<div class="fr-labels"><div class="fr-h"></div><div class="fr-lbody">${labels}</div></div>`}
    <div class="fr-scroll"><div class="fr-canvas"><div class="fr-axis">${axis}</div><div class="fr-body"><div class="fr-bg">${bg}</div>${lanes}</div></div></div>
  </div>`;

const modalRoot = $('#modal-root');
const modalStack = [];
function openModal(o) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  wrap.innerHTML = `<div class="modal ${o.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(o.label || '')}" tabindex="-1">${o.html || ''}</div>`;
  modalRoot.appendChild(wrap);
  const m = { wrap, refresh: o.refresh, onMount: o.onMount, onClose: o.onClose, prevFocus: document.activeElement, down: false };
  modalStack.push(m);
  document.body.classList.add('has-modal');
  wrap.addEventListener('mousedown', e => { m.down = e.target === wrap; });
  wrap.addEventListener('click', e => { if (e.target === wrap && m.down) closeModal(m); });
  const box = wrap.firstElementChild;
  if (o.onMount) o.onMount(box, m);
  const af = box.querySelector('[data-autofocus]');
  (af || box).focus({ preventScroll: true });
  return m;
}
function closeModal(m) {
  m = m || modalStack[modalStack.length - 1];
  const i = modalStack.indexOf(m);
  if (i < 0) return;
  modalStack.splice(i, 1);
  m.wrap.remove();
  if (!modalStack.length) document.body.classList.remove('has-modal');
  try { if (m.prevFocus && document.contains(m.prevFocus)) m.prevFocus.focus({ preventScroll: true }); } catch (e) {}
  if (m.onClose) m.onClose();
}
function modalOf(el) { return modalStack.find(m => m.wrap.contains(el)); }
function refreshModals() {
  modalStack.slice().forEach(m => {
    if (!m.refresh) return;
    const html = m.refresh();
    if (html === null) { closeModal(m); return; }
    const box = m.wrap.firstElementChild;
    const st = m.wrap.scrollTop, ae = document.activeElement, fid = ae && ae.id && m.wrap.contains(ae) ? ae.id : null;
    box.innerHTML = html;
    if (m.onMount) m.onMount(box, m);
    m.wrap.scrollTop = st;
    if (fid) { const el = box.querySelector('#' + CSS.escape(fid)); if (el) el.focus({ preventScroll: true }); }
  });
}
function confirmDialog({ title, html, ok = 'Confirmer', danger = false, type = null }) {
  return new Promise(resolve => {
    let done = false;
    const fin = v => { if (!done) { done = true; resolve(v); } };
    openModal({
      label: title,
      html: `<div class="modal-head"><h3>${esc(title)}</h3></div><div class="modal-body"><div class="note">${html}</div>${type ? `<div class="field" style="margin-top:12px"><label class="label" for="cf-type">Tape ${esc(type)} pour confirmer</label><input type="text" id="cf-type" autocomplete="off" data-autofocus></div>` : ''}</div><div class="modal-foot"><button type="button" class="btn ghost" data-x="no">Annuler</button><button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-x="yes" ${type ? 'disabled' : 'data-autofocus'}>${esc(ok)}</button></div>`,
      onMount(box, mm) {

async function download(filename, data, fallbackText) {
  const type = /\.json$/.test(filename) ? 'application/json' : /\.csv$/.test(filename) ? 'text/csv' : /\.html$/.test(filename) ? 'text/html' : 'text/plain';
  let file = null;
  try { file = new File([data], filename, { type }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.share) {
    let ok = false;
    try { ok = navigator.canShare({ files: [file] }); } catch (e) { ok = false; }
    if (ok) {
      try { await navigator.share({ files: [file], title: filename }); return true; }
      catch (e) { if (e && e.name === 'AbortError') return false; }
    }
  }

    const url = URL.createObjectURL(file || new Blob([data], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    return true;
  } catch (e) { /* copie ci-dessous */ }
  openTextModal('Copier le contenu', fallbackText != null ? fallbackText : (typeof data === 'string' ? data : ''), `Copie ce texte et colle-le dans un fichier « ${filename} ».`);
  return false;
}

function appelText(c, day) {
  const se = seanceOf(c.id, day);

  const sel = f => c.eleves.filter(e => f(entryOf(se, e.id)));
  const names = (l, withNote) => l.map(e => nomComplet(e) + (withNote && entryOf(se, e.id).n ? ` (${entryOf(se, e.id).n})` : '')).join(', ');
  const abs = sel(en => en.p === 'A'), ret = sel(en => en.p === 'R'), oub = sel(en => en.t), moins = sel(en => en.c === -1), plus = sel(en => en.c === 1);
  lines.push(`Présents : ${c.eleves.length - abs.length} sur ${c.eleves.length}${se ? '' : ' (appel non validé)'}`);
  if (abs.length) lines.push(`Absents (${abs.length}) : ${names(abs)}`);
  if (ret.length) lines.push(`Retards (${ret.length}) : ${names(ret)}`);
  if (oub.length) lines.push(`Oublis de tenue (${oub.length}) : ${names(oub)}`);

  if (inap.length) {

    inap.forEach(r => {

    });
  }
  if (moins.length) lines.push(`Comportement à reprendre : ${names(moins, true)}`);

}

/* ============ Semaines A/B et créneaux ============ */
function normCreneaux(b) {
  if (Array.isArray(b.creneaux)) return b.creneaux.filter(k => k && Number(k.j) >= 0 && Number(k.j) <= 6).map(k => ({ j: Number(k.j), h1: k.h1 || '', h2: k.h2 || '', sem: k.sem === 'A' || k.sem === 'B' ? k.sem : '', lieu: k.lieu || '' }));
  return (Array.isArray(b.jours) ? b.jours : []).map(j => ({ j: Number(j), h1: '', h2: '', sem: '', lieu: '' }));
}
function mondayOf(s) { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); }
function weekIsVac(mon, st) {
  for (let i = 0; i < 5; i++) { const s = addDays(mon, i); if (!(st.vacances || []).some(v => v.debut <= s && s <= v.fin)) return false; }
  return true;
}
function weekAB(s, st) {
  st = st || S.settings;
  if (!st.semAB || !isIso(s)) return '';
  const mon = mondayOf(s), useMemo = st === S.settings, mk = 'ab|' + mon;
  if (useMemo && MEMO.has(mk)) return MEMO.get(mk);
  const anchors = [[mondayOf(isIso(st.semRef) ? st.semRef : st.debut), 'A']]
    .concat(Object.entries(st.semForce || {}).filter(([k, v]) => isIso(k) && (v === 'A' || v === 'B')).map(([k, v]) => [mondayOf(k), v]))
    .sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
  let an = anchors[0];
  for (const a of anchors) if (a[0] <= mon) an = a;
  let n = 0;
  if (st.semVacCompte) n = Math.round(diffDays(an[0], mon) / 7);
  else {
    const step = mon >= an[0] ? 7 : -7;
    let w = an[0], guard = 0;
    while (w !== mon && guard++ < 400) { w = addDays(w, step); if (!weekIsVac(w, st)) n += step > 0 ? 1 : -1; }
  }
  const v = ((n % 2) + 2) % 2 === 0 ? an[1] : (an[1] === 'A' ? 'B' : 'A');
  if (useMemo) MEMO.set(mk, v);
  return v;
}
function creneauxOn(c, day) {
  if (!c || !c.creneaux || !isIso(day) || inVac(day)) return [];
  const wd = parse(day).getDay(), ab = weekAB(day);
  return c.creneaux.filter(k => k.j === wd && (!k.sem || !ab || k.sem === ab)).sort((a, b) => (a.h1 || '99').localeCompare(b.h1 || '99'));
}
function epsOn(c, day) { return creneauxOn(c, day).length > 0; }
const hTxt = k => (k && k.h1 ? k.h1.replace(':', 'h') + (k.h2 ? '–' + k.h2.replace(':', 'h') : '') : '');
function crRow(k, i) {
  return `<div class="crrow">
    <select id="cr-${i}-j" data-ch="cr-f" data-i="${i}" data-k="j" aria-label="Jour">${JOURS_EPS.map(([j]) => `<option value="${j}" ${k.j === j ? 'selected' : ''}>${cap(JOURS_L[j])}</option>`).join('')}</select>
    <input type="time" id="cr-${i}-h1" data-ch="cr-f" data-i="${i}" data-k="h1" value="${esc(k.h1)}" aria-label="Heure de début">
    <input type="time" id="cr-${i}-h2" data-ch="cr-f" data-i="${i}" data-k="h2" value="${esc(k.h2)}" aria-label="Heure de fin">
    ${S.settings.semAB ? `<select id="cr-${i}-sem" data-ch="cr-f" data-i="${i}" data-k="sem" aria-label="Semaine"><option value="">Chaque semaine</option><option value="A" ${k.sem === 'A' ? 'selected' : ''}>Semaine A</option><option value="B" ${k.sem === 'B' ? 'selected' : ''}>Semaine B</option></select>` : ''}
    <input type="text" id="cr-${i}-lieu" data-ch="cr-f" data-i="${i}" data-k="lieu" value="${esc(k.lieu)}" placeholder="Lieu (gymnase, stade…)" aria-label="Lieu">
    <button type="button" class="icon-btn" data-act="cr-del" data-i="${i}" aria-label="Retirer ce créneau">×</button>
  </div>`;
}
function abWeeks(D) {
  const T = todayIso(), out = [];
  let w = mondayOf(D.debut), guard = 0;

function resizeImage(file, size) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const cv = document.createElement('canvas'); cv.width = cv.height = size;
      cv.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

/* ============ Code d'accès ============ */
const LS_PIN = 'dispenses-eps-pin';
const LOCK = { on: false, entry: '' };
function pinGet() { try { return localStorage.getItem(LS_PIN) || ''; } catch (e) { return ''; } }
function pinSet(h) { try { if (h) localStorage.setItem(LS_PIN, h); else localStorage.removeItem(LS_PIN); } catch (e) { toast('Impossible d’enregistrer le code sur cet appareil.'); } }
function pinAvailable() { try { localStorage.setItem('__eps', '1'); localStorage.removeItem('__eps'); return true; } catch (e) { return false; } }
async function pinHash(pin) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('eps|' + pin));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 2166136261;
    for (const ch of 'eps|' + pin) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    return 'f' + (h >>> 0).toString(16);
  }
}
function drawLock(err) {
  $('#lock').innerHTML = `<div class="lock-box"><span class="brand-mark" aria-hidden="true">EPS</span><div class="brand-title">Code d’accès</div>
    <div class="lock-dots ${err ? 'shake' : ''}" aria-live="polite" aria-label="${LOCK.entry.length} chiffre${LOCK.entry.length > 1 ? 's' : ''} sur 4">${[0, 1, 2, 3].map(i => `<i class="${i < LOCK.entry.length ? 'on' : ''}"></i>`).join('')}</div>
    <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-k="${n}">${n}</button>`).join('')}<span></span><button type="button" data-k="0">0</button><button type="button" data-k="del" aria-label="Effacer">⌫</button></div>
    <button type="button" class="lock-btn" data-k="forgot">Code oublié ?</button><p class="sm" id="lock-msg"></p></div>`;
}
function showLock() { if (!pinGet()) return; LOCK.on = true; LOCK.entry = ''; document.body.classList.add('locked'); $('#lock').hidden = false; drawLock(); tip.hidden = true; }
async function tryUnlock() {
  const h = await pinHash(LOCK.entry);
  if (h === pinGet()) { LOCK.on = false; LOCK.entry = ''; document.body.classList.remove('locked'); $('#lock').hidden = true; }
  else { LOCK.entry = ''; drawLock(true); }
}
function lockKey(k) {
  if (k === 'forgot') { const msg = $('#lock-msg'); if (msg) msg.textContent = 'Le code est enregistré sur cet appareil uniquement. Pour le retirer, supprime les données de l’application sur l’appareil (ou l’app de l’écran d’accueil), réinstalle-la puis restaure ta dernière sauvegarde.'; return; }
  if (k === 'del') LOCK.entry = LOCK.entry.slice(0, -1);
  else if (/^\d$/.test(k) && LOCK.entry.length < 4) LOCK.entry += k;
  drawLock();
  if (LOCK.entry.length === 4) tryUnlock();
}
$('#lock').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) lockKey(b.dataset.k); });
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (pinGet() && !LOCK.on && hiddenAt && Date.now() - hiddenAt > 5 * 60000) showLock();
});
function pinSection() {
  if (!pinAvailable()) return '<p class="muted sm">Le code d’accès n’est pas disponible dans cette vue.</p>';
  const has = !!pinGet();
  return `<div class="note"><p>${has ? 'Un code protège l’application sur cet appareil : elle se verrouille à l’ouverture et après 5 minutes en arrière-plan.' : 'Protège l’ouverture de l’application sur cet appareil avec un code à 4 chiffres.'}</p><p class="muted sm">Le code évite un regard rapide sur l’écran ; il ne chiffre pas les données.</p></div>
  <div class="row-gap">${has ? '<button class="btn" data-act="pin-set">Changer le code</button><button class="btn ghost danger-t" data-act="pin-del">Supprimer le code</button><button class="btn ghost" data-act="lock-now">Verrouiller</button>' : '<button class="btn primary" data-act="pin-set">Définir un code</button>'}</div>`;
}
function openPinForm(mode) {
  const has = !!pinGet();
  openModal({
    label: 'Code d’accès',
    html: `<form novalidate><div class="modal-head"><h3>${mode === 'del' ? 'Supprimer le code' : has ? 'Changer le code' : 'Définir un code'}</h3><button type="button" class="icon-btn" data-act="close-modal" aria-label="Fermer">×</button></div><div class="modal-body">
      ${has ? '<div class="field"><label class="label" for="pin-old">Code actuel</label><input type="password" id="pin-old" inputmode="numeric" maxlength="4" autocomplete="off" data-autofocus></div>' : ''}
      ${mode === 'del' ? '' : `<div class="grid-2"><div class="field"><label class="label" for="pin-new">Nouveau code (4 chiffres)</label><input type="password" id="pin-new" inputmode="numeric" maxlength="4" autocomplete="off" ${has ? '' : 'data-autofocus'}></div><div class="field"><label class="label" for="pin-new2">Confirmer</label><input type="password" id="pin-new2" inputmode="numeric" maxlength="4" autocomplete="off"></div></div>`}
      <p class="hint">Le code reste sur cet appareil. S’il est oublié, il faudra effacer les données de l’application sur l’appareil puis restaurer une sauvegarde.</p><p class="form-err" id="pin-err" role="alert"></p></div>
      <div class="modal-foot"><button type="button" class="btn ghost" data-act="close-modal">Annuler</button><button type="submit" class="btn ${mode === 'del' ? 'danger' : 'primary'}">${mode === 'del' ? 'Supprimer' : 'Enregistrer'}</button></div></form>`,
    onMount(box, m) {
      box.querySelector('form').onsubmit = async ev => {
        ev.preventDefault();
        const err = box.querySelector('#pin-err');
        if (has && (await pinHash(box.querySelector('#pin-old').value)) !== pinGet()) { err.textContent = 'Code actuel incorrect.'; return; }
        if (mode === 'del') { pinSet(''); closeModal(m); toast('Code supprimé.'); render(); return; }
        const a = box.querySelector('#pin-new').value, b = box.querySelector('#pin-new2').value;
        if (!/^\d{4}$/.test(a)) { err.textContent = 'Le code doit comporter 4 chiffres.'; return; }
        if (a !== b) { err.textContent = 'Les deux codes ne correspondent pas.'; return; }
        pinSet(await pinHash(a)); closeModal(m);
        toast('Code enregistré : l’application se verrouillera à l’ouverture.'); render();
      };
    },
  });
}

/* ============ Stockage local (IndexedDB) ============ */
const IDB = { db: null };
function idbOpen() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('dispenses-eps', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('docs');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('blocked'));
    } catch (e) { rej(e); }
  });
}
function idbAll(db) {
  return new Promise((res, rej) => {
    const m = new Map(), tx = db.transaction('docs', 'readonly'), cur = tx.objectStore('docs').openCursor();
    cur.onsuccess = () => { const c = cur.result; if (c) { m.set(c.key, c.value); c.continue(); } else res(m); };
    cur.onerror = () => rej(cur.error);
  });
}
function idbWrite(id, body) {
  return new Promise((res, rej) => {
    const tx = IDB.db.transaction('docs', 'readwrite'), st = tx.objectStore('docs');
    if (body === null) st.delete(id); else st.put(body, id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}
